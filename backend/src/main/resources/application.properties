# ─── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/movieapp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── API Keys (injected from environment) ──────────────────
tmdb.api.key=${TMDB_API_KEY}
gemini.api.key=${GEMINI_API_KEY:}

# ─── TMDB base URL ─────────────────────────────────────────
tmdb.base.url=https://api.themoviedb.org/3

# ─── Gemini base URL ───────────────────────────────────────
gemini.base.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# ─── Server ────────────────────────────────────────────────
server.port=8080
